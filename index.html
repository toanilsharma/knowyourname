    :root {

    body {

      color: var(--text-primary);

      position: relative;

    /* Fixed gradient background that adapts slightly or stays subtle */

      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-image:

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px var(--glass-shadow);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .glass-panel-light {
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid var(--glass-border);
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {

      .animate-fade-in-up,
      .animate-pulse-slow {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    /* --- PROFESSIONAL PRINT STYLESHEET (PDF Export) --- */
    @media print {
      @page {
        margin: 1cm;
        size: auto;
      }

      body {
        background: white !important;
        color: black !important;
        font-family: 'Georgia', serif;
      }

      /* Hide UI elements */
      header,
      footer,
      button,
      .no-print,
      input,
      .fixed,
      .absolute.top-full {
        display: none !important;
      }

      /* Hide background effects */
      body::before {
        display: none !important;
      }

      /* Reset containers for print width */
      .max-w-5xl,
      .max-w-6xl,
      .max-w-4xl,
      .w-full {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Card Styling for Print */
      .glass-panel,
      .glass-panel-light {
        background: white !important;
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        break-inside: avoid;
        /* Prevent card splitting across pages */
        margin-bottom: 20px !important;
        color: black !important;
      }

      /* Typography adjustments */
      h1,
      h2,
      h3 {
        color: black !important;
      }

      p,
      span {
        color: #333 !important;
      }

      /* Force background colors for charts */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Special handling for text that shouldn't be dark mode */
      .dark\:text-white {
        color: black !important;
      }

      .dark\:text-slate-300 {
        color: #444 !important;
      }

      /* Add a print header */
      body::after {
        content: "Analysis Generated by KnowYourName.co.in";
        display: block;
        text-align: center;
        font-size: 10px;
        color: #999;
        margin-top: 20px;
        border-top: 1px solid #eee;
        padding-top: 10px;
